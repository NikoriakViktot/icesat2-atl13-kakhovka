# Let a BFF on another Compose stack reach the API by name (e.g. Django on geohydroai.org):
#   BFF_NETWORK=geoai_web   -> the API joins it as `icesat2-api`, so the BFF uses http://icesat2-api:8000
# Compose also registers the service name (`api`) as a DNS alias on that network: do NOT use a network
# where another `api` already lives (geohydroai.org's geoai_web has one: nginx would round-robin to us).
# There, put the BFF on the database network instead and use the container name (docs/deployment.md).
# scripts/deploy_server.sh adds this file when BFF_NETWORK is set. Only the API joins; the
# worker, Redis and the database stay off that network.
services:
  api:
    networks:
      default: {}
      bff:
        aliases: [icesat2-api]

networks:
  bff:
    external: true
    name: ${BFF_NETWORK:?set BFF_NETWORK to the Docker network of the BFF}
